name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, for each page's last-modified date

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Subset icon font to the icons the site uses
        run: python3 scripts/update-icon-font.py

      - name: Generate llms.txt from news and events
        run: python3 scripts/update-llms-txt.py

      - name: Write each page's last-modified date (from git history)
        run: python3 scripts/update-modified-dates.py

      - name: Pre-render JavaScript content into the HTML (for crawlers and AI)
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python3 scripts/prerender.py

      - name: Add cache-busting version to CSS/JS links
        run: |
          V="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s#((href|src)=\"[^\"?]*(css|js)/[^\"?]+\.(css|js))\"#\1?v=${V}\"#g"
          grep -c "app.css?v=${V}" index.html

      - name: Deploy site files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.cursor/**
            **/scripts/**
            **/.DS_Store
            dist/**
            design-system/**
            data/**
            package.json
            package-lock.json
            tailwind.config.js
            css/tailwind-src.css
            .cpanel.yml
            **/*.md
